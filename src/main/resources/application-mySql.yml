# MySQL 專用設定；啟動參數：--spring.profiles.active=mySql
# 共用設定由原始 application.yml 載入。
spring:
    datasource:
        driver-class-name: 'com.mysql.cj.jdbc.Driver'
        url: 'jdbc:mysql://localhost:3306/apinvoice?cachePrepStmts=true&rewriteBatchedStatements=true&useUnicode=yes&characterEncoding=UTF-8&useSSL=false&serverTimezone=GMT%2B8'
        username: 'root'
        password: 'root'
        hikari:
            maximum-pool-size: 10
    jpa:
        show-sql: false
        hibernate:
            ddl-auto: 'none'
        properties:
            hibernate:
                dialect: 'org.hibernate.dialect.MySQL8Dialect'
    cache:
        type: 'redis'
    # Spring Boot 3 使用 spring.data.redis；數值與 application.properties 同步。
    data:
        redis:
            host: 'localhost'
            port: 6379
            password: '0935'
            database: 1
            timeout: 3000
            # 以下連線池設定僅供 Jedis 使用，Redisson 不會讀取。
            jedis:
                pool:
                    max-active: 50
                    min-idle: 5
                    max-wait: 3000
                    max-idle: 20
    mail:
        address: service@tpisoftware.com
        host: smtp.gmail.com
        pcode: ENC()
        username: '[langingH2]GreenSwift'

redisson:
    address: redis://${spring.data.redis.host}:${spring.data.redis.port}
    password: ${spring.data.redis.password}
    database: ${spring.data.redis.database}

