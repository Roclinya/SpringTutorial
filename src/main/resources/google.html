<body>
<h1>reCAPTCHA Token Generator</h1>
<button id="verifyButton">Generate Token</button>
<div id="tokenDisplay" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc; background-color: #f9f9f9;">
    <!-- Token will be displayed here -->
    <strong>Token:</strong> <span id="tokenValue">None</span>
</div>

<script>
    document.getElementById('verifyButton').addEventListener('click', function () {
      grecaptcha.enterprise.ready(() => {
        grecaptcha.enterprise.execute('6LeHgIwqAAAAAJLTblHhg7t06wb2qvEfTuFr-BNx', { action: 'verify' })
          .then((token) => {
            console.log('Generated Token:', token);

            // 將 Token 插入到頁面中的 <span> 元素
            document.getElementById('tokenValue').textContent = token;
          })
          .catch((error) => {
            console.error('Error generating token:', error);

            // 如果出錯，顯示錯誤信息
            document.getElementById('tokenValue').textContent = 'Error generating token!';
          });
      });
    });
</script>
</body>
