##        initialization-mode: always
##        schema: classpath:schema.sql
    datasource:
        url: jdbc:oracle:thin:@localhost:1521/ORCLCDB # 使用 Service Name 時，替換為 @localhost:1521/xe
        username: sys as sysdba
        password: oracle
        driver-class-name: oracle.jdbc.OracleDriver
    sql:
        init:
            schema-location: classpath:schema-h2.sql
            mode: embedded  #第一次啟動之後always要改成 embedded或者never 下次啟動才不會再次執行sql檔案的DDL而可能造成重複執行insert出錯

