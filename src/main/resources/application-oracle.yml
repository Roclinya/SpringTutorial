##        hibernate.ddl-auto: validate => validate 設置會要求資料庫中的表結構與映射模型完全匹配，但它不會自動創建或更新表格。
##        要解決這個問題，你可以更改 hibernate.ddl-auto 設置，以便在資料庫中自動創建缺失的表格。以下是一些選項：
##
##        create: 每次啟動時刪除現有的表格並重新創建。
##        update: 只更新現有的表結構，不刪除或重建表格。適合在開發階段使用，因為它可以根據模型自動添加新表或新欄位。
##        create-drop: 每次啟動時創建表格，並在應用停止時刪除表格。
##        建議
##        將 hibernate.ddl-auto 設置為 update，這樣可以在資料庫中自動創建缺失的表格。
#        hibernate.ddl-auto: update
#        generate-ddl: true
    jpa:
        hibernate:
            ddl-auto: update # 或 none, validate, create, create-drop，根據需求選擇
        properties:
            hibernate:
                dialect: org.hibernate.dialect.OracleDialect

